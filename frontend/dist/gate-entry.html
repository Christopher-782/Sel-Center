<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEL Center - Gate Entry</title><link rel="icon" type="image/avif" href="https://res.cloudinary.com/deoqw88yb/image/upload/v1782220892/1sel_yar5yk.avif"><style>
  .sel-brand-image{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit;}
  .sel-wordmark-image{display:block;height:34px;width:auto;max-width:120px;object-fit:contain;}
  .sel-logo-row{display:flex!important;align-items:center;gap:8px;}
  .sel-login-logo{display:block;width:92px;max-width:45%;height:auto;max-height:76px;object-fit:contain;margin:0 auto 16px;}
</style><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/operations.css">  <link rel="stylesheet" href="css/site-dynamic.css">
</head><body>
<header class="app-header"><div class="brand"><a class="brand-mark" href="app.html" style="text-decoration:none" aria-label="SEL Center home"><img src="https://res.cloudinary.com/deoqw88yb/image/upload/v1782220892/1sel_yar5yk.avif" alt="SEL Center logo" class="sel-brand-image"></a><div><h1>Gate Entry</h1><p>Entry fee recording</p></div></div><div class="header-actions"><span class="user-pill" data-user-name>User</span><a class="icon-btn" href="app.html"><i class="fa-solid fa-house"></i></a><button class="icon-btn" onclick="SELAccess.logout()"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
<main class="shell"><div class="page-title"><div><h2>Record Gate Entry Fee</h2><p>This page is restricted to users with Gate Entry permission.</p></div></div><div class="split"><section class="card"><div class="card-head"><h3><i class="fa-solid fa-receipt"></i> New Entry</h3></div><div class="card-body"><div id="gateAlert" class="hidden"></div><form id="gateForm" class="form-grid">
<div class="field full"><label>Entry Fee Total (₦)</label><input id="amount" type="number" min="0" step="0.01" required placeholder="0.00"></div><div class="field"><label>Number of Visitors</label><input id="personsCount" type="number" min="1" value="1" required></div><div class="field"><label>Payment Method</label><select id="paymentMode"><option value="cash">Cash</option><option value="card">Card</option><option value="transfer">Transfer</option></select></div><div class="field full" id="gateCashFields"><div class="cash-tender-inline"><div><label>Cash Received (₦)</label><input id="cashReceived" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="change-preview compact"><span>Change to customer</span><strong id="gateChangePreview">₦0.00</strong></div></div></div><div class="field full"><label>Payer / Group Name (optional)</label><input id="payerName" maxlength="120"></div><div class="field full"><label>Notes (optional)</label><textarea id="notes" rows="3"></textarea></div><div class="field full"><button class="btn btn-primary" id="saveGate"><i class="fa-solid fa-check"></i> Record Entry</button></div>
</form><div id="gateReceipt" class="receipt"></div><button class="btn btn-secondary hidden" type="button" id="printGateReceipt" style="margin-top:12px"><i class="fa-solid fa-print"></i> Print receipt</button></div></section><section class="card"><div class="card-head"><h3>Today's Entries</h3><button class="btn btn-secondary" id="refreshGate"><i class="fa-solid fa-rotate"></i></button></div><div class="card-body"><div class="stat-grid" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><span>Entries</span><strong id="entryCount">0</strong></div><div class="stat"><span>Collected</span><strong id="entryTotal">₦0.00</strong></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Time</th><th>Visitors</th><th>Payment</th><th>Amount</th></tr></thead><tbody id="gateRows"></tbody></table></div></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/access-control.js"></script><script src="js/receipt-printer.js"></script><script src="js/gate-entry.js"></script>  <script src="js/site-dynamic.js"></script>
</body></html>
