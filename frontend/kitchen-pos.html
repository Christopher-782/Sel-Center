<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEL Center - Kitchen POS</title><link rel="icon" type="image/avif" href="https://res.cloudinary.com/deoqw88yb/image/upload/v1782220892/1sel_yar5yk.avif"><style>
  .sel-brand-image{display:block;width:100%;height:100%;object-fit:contain;border-radius:inherit;}
  .sel-wordmark-image{display:block;height:34px;width:auto;max-width:120px;object-fit:contain;}
  .sel-logo-row{display:flex!important;align-items:center;gap:8px;}
  .sel-login-logo{display:block;width:92px;max-width:45%;height:auto;max-height:76px;object-fit:contain;margin:0 auto 16px;}
</style><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="css/operations.css">  <link rel="stylesheet" href="css/site-dynamic.css">
</head><body data-pos-mode="kitchen">
<header class="app-header"><div class="brand"><a class="brand-mark" href="app.html" style="text-decoration:none" aria-label="SEL Center home"><img src="https://res.cloudinary.com/deoqw88yb/image/upload/v1782220892/1sel_yar5yk.avif" alt="SEL Center logo" class="sel-brand-image"></a><div><h1>Kitchen POS</h1><p>Drinks · Meals · Desserts</p></div></div><div class="header-actions"><span class="user-pill" data-user-name>User</span><a class="icon-btn" href="app.html"><i class="fa-solid fa-house"></i></a><button class="icon-btn" onclick="SELAccess.logout()"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>
<main class="shell"><div class="page-title"><div><h2>Kitchen Production Sales</h2><p>Select products, adjust quantities, then choose a payment method.</p></div><button class="btn btn-secondary" id="printLast" disabled><i class="fa-solid fa-print"></i> Print last receipt</button></div><div id="posAlert" class="hidden"></div><div class="pos-layout"><section class="catalog"><div class="toolbar"><input class="search-input" id="productSearch" placeholder="Search kitchen products..."><div class="tabs" id="categoryTabs"><button class="tab active" data-cat="all">All</button><button class="tab" data-cat="drinks">Drinks</button><button class="tab" data-cat="meals">Meals</button><button class="tab" data-cat="desserts">Desserts</button></div></div><div class="product-grid" id="productGrid"></div></section><aside class="card cart"><div class="card-head"><h3><i class="fa-solid fa-cart-shopping"></i> Current Sale</h3><button class="btn btn-secondary" id="clearCart">Clear</button></div><div class="cart-list" id="cartList"></div><div class="cart-summary"><div class="summary-line"><span>Items</span><strong id="itemCount">0</strong></div><div class="summary-line total"><span>Total</span><strong id="cartTotal">₦0.00</strong></div><div class="payment-grid"><button class="btn btn-success" data-pay="cash">Cash</button><button class="btn btn-primary" data-pay="card">Card</button><button class="btn btn-secondary" data-pay="transfer">Transfer</button></div><div id="lastReceipt" class="receipt"></div></div></aside></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabaseClient.js"></script><script src="js/access-control.js"></script><script src="js/receipt-printer.js"></script><script src="js/pos-engine.js"></script>  <script src="js/site-dynamic.js"></script>
</body></html>
